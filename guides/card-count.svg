<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="280" fill="#fffbeb"/>
  <text x="320" y="40" text-anchor="middle" fill="#111" font-size="24" font-weight="700">Point, then make one mark</text>
  <g font-size="36" font-weight="700" text-anchor="middle">
    <rect x="40" y="70" width="160" height="120" rx="16" fill="#fff" stroke="#111" stroke-width="5"/>
    <text x="120" y="145">1</text>
    <rect x="240" y="70" width="160" height="120" rx="16" fill="#fff" stroke="#111" stroke-width="5"/>
    <text x="320" y="145">2</text>
    <rect x="440" y="70" width="160" height="120" rx="16" fill="#fff" stroke="#111" stroke-width="5"/>
    <text x="520" y="145">3</text>
  </g>
  <text x="320" y="240" text-anchor="middle" fill="#111" font-size="18">Point at something you choose. Make a mark. Point again.</text>
</svg>
