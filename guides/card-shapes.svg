<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="320" fill="#fff"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="700">Three shapes to look for</text>
  <g>
    <rect x="24" y="50" width="210" height="180" rx="12" fill="#e2e8f0" stroke="#111" stroke-width="3"/>
    <ellipse cx="129" cy="140" rx="50" ry="22" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
    <text x="129" y="268" text-anchor="middle" font-size="20" font-weight="700">crater</text>
    <text x="129" y="294" text-anchor="middle" font-size="16">a round pit</text>
  </g>
  <g>
    <rect x="254" y="50" width="210" height="180" rx="12" fill="#e2e8f0" stroke="#111" stroke-width="3"/>
    <path d="M300 170 L359 80 L418 170" fill="none" stroke="#334155" stroke-width="8"/>
    <text x="359" y="268" text-anchor="middle" font-size="20" font-weight="700">cliff</text>
    <text x="359" y="294" text-anchor="middle" font-size="16">a long steep edge</text>
  </g>
  <g>
    <rect x="484" y="50" width="210" height="180" rx="12" fill="#f8fafc" stroke="#111" stroke-width="3"/>
    <rect x="520" y="150" width="140" height="28" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
    <text x="589" y="268" text-anchor="middle" font-size="20" font-weight="700">plain</text>
    <text x="589" y="294" text-anchor="middle" font-size="16">wide flat land</text>
  </g>
</svg>
