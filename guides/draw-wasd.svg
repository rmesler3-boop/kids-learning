<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="420" fill="#fff8e8"/>
  <rect x="8" y="8" width="624" height="46" rx="8" fill="#9a3412"/>
  <text x="320" y="38" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">CONCEPTUAL DRAWING - not a screenshot, not the game menu</text>
  <text x="320" y="78" text-anchor="middle" fill="#111" font-size="22" font-weight="700">Child keys: look around with W A S D</text>
  <g font-size="28" font-weight="700" text-anchor="middle">
    <rect x="270" y="100" width="90" height="70" rx="10" fill="#fde047" stroke="#111" stroke-width="4"/>
    <text x="315" y="146">W</text>
    <rect x="170" y="180" width="90" height="70" rx="10" fill="#fde047" stroke="#111" stroke-width="4"/>
    <text x="215" y="226">A</text>
    <rect x="270" y="180" width="90" height="70" rx="10" fill="#fde047" stroke="#111" stroke-width="4"/>
    <text x="315" y="226">S</text>
    <rect x="370" y="180" width="90" height="70" rx="10" fill="#fde047" stroke="#111" stroke-width="4"/>
    <text x="415" y="226">D</text>
  </g>
  <text x="315" y="276" text-anchor="middle" fill="#111" font-size="16">W forward | A left | D right | S back</text>
  <text x="320" y="312" text-anchor="middle" fill="#111" font-size="16">Stop often. Looking is the job. Speed is not a gravity test.</text>
  <rect x="24" y="332" width="592" height="70" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="320" y="360" text-anchor="middle" fill="#111" font-size="15">Grown-up presses H first and checks that these letters match Help.</text>
  <text x="320" y="384" text-anchor="middle" fill="#111" font-size="15">This web page cannot start the game. There is no launch button.</text>
</svg>
