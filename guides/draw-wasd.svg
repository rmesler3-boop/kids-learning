<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="360" fill="#fff8e8"/>
  <text x="320" y="36" text-anchor="middle" fill="#111" font-size="22" font-weight="700">How to drive</text>
  <g font-size="28" font-weight="700" text-anchor="middle">
    <rect x="270" y="58" width="90" height="70" rx="10" fill="#fde047" stroke="#111" stroke-width="4"/>
    <text x="315" y="104">W</text>
    <rect x="170" y="140" width="90" height="70" rx="10" fill="#fde047" stroke="#111" stroke-width="4"/>
    <text x="215" y="186">A</text>
    <rect x="270" y="140" width="90" height="70" rx="10" fill="#fde047" stroke="#111" stroke-width="4"/>
    <text x="315" y="186">S</text>
    <rect x="370" y="140" width="90" height="70" rx="10" fill="#fde047" stroke="#111" stroke-width="4"/>
    <text x="415" y="186">D</text>
  </g>
  <text x="320" y="250" text-anchor="middle" fill="#111" font-size="18">W forward | A left | D right | S back</text>
  <text x="320" y="286" text-anchor="middle" fill="#111" font-size="18">Stop often and look.</text>
  <text x="320" y="326" text-anchor="middle" fill="#111" font-size="16">A grown-up opens the game. You only use these four keys.</text>
</svg>
