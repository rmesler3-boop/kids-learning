<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" font-family="Arial" font-weight="bold"><rect width="100%" height="100%" fill="#fff"/><text x="220.0" y="28" font-size="22" text-anchor="middle">5 black keys = a 5-note scale</text><rect x="10" y="45" width="60" height="170" fill="#fff" stroke="#111" stroke-width="2"/><rect x="70" y="45" width="60" height="170" fill="#fff" stroke="#111" stroke-width="2"/><rect x="130" y="45" width="60" height="170" fill="#fff" stroke="#111" stroke-width="2"/><rect x="190" y="45" width="60" height="170" fill="#fff" stroke="#111" stroke-width="2"/><rect x="250" y="45" width="60" height="170" fill="#fff" stroke="#111" stroke-width="2"/><rect x="310" y="45" width="60" height="170" fill="#fff" stroke="#111" stroke-width="2"/><rect x="370" y="45" width="60" height="170" fill="#fff" stroke="#111" stroke-width="2"/><rect x="51" y="45" width="38" height="105" fill="#111"/><circle cx="70" cy="125" r="16" fill="#2563eb"/><text x="70" y="132" font-size="20" fill="#fff" text-anchor="middle">1</text><rect x="111" y="45" width="38" height="105" fill="#111"/><circle cx="130" cy="125" r="16" fill="#2563eb"/><text x="130" y="132" font-size="20" fill="#fff" text-anchor="middle">2</text><rect x="231" y="45" width="38" height="105" fill="#111"/><circle cx="250" cy="125" r="16" fill="#7c3aed"/><text x="250" y="132" font-size="20" fill="#fff" text-anchor="middle">3</text><rect x="291" y="45" width="38" height="105" fill="#111"/><circle cx="310" cy="125" r="16" fill="#7c3aed"/><text x="310" y="132" font-size="20" fill="#fff" text-anchor="middle">4</text><rect x="351" y="45" width="38" height="105" fill="#111"/><circle cx="370" cy="125" r="16" fill="#7c3aed"/><text x="370" y="132" font-size="20" fill="#fff" text-anchor="middle">5</text><text x="220.0" y="240" font-size="15" text-anchor="middle">Group of 2 (blue) + group of 3 (purple) = 5 notes</text></svg>