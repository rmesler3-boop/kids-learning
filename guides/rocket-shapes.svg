<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Arial" font-weight="bold"><rect width="100%" height="100%" fill="#fff"/><text x="280" y="26" font-size="22" text-anchor="middle">🚀 Shape rocket: cut and glue</text><g transform="translate(0,0)"><text x="150" y="60" font-size="16" text-anchor="middle">Grown-up cuts from colored paper:</text><polygon points="40,80 70,130 10,130" fill="#dc2626" stroke="#111" stroke-width="2"/><text x="40" y="150" font-size="13" text-anchor="middle">1 big △</text><rect x="100" y="80" width="40" height="70" fill="#93c5fd" stroke="#111" stroke-width="2"/><text x="120" y="168" font-size="13" text-anchor="middle">1 ▭</text><circle cx="190" cy="100" r="14" fill="#fde047" stroke="#111" stroke-width="2"/><circle cx="225" cy="100" r="14" fill="#fde047" stroke="#111" stroke-width="2"/><text x="207" y="135" font-size="13" text-anchor="middle">2 ◯</text><polygon points="260,80 285,120 260,115" fill="#16a34a" stroke="#111" stroke-width="2"/><polygon points="295,80 320,120 295,115" fill="#16a34a" stroke="#111" stroke-width="2"/><text x="290" y="140" font-size="13" text-anchor="middle">2 small △</text><text x="150" y="220" font-size="18" text-anchor="middle">Glue them into a rocket →</text></g><g transform="translate(360,0)"><polygon points="100,40 140,110 60,110" fill="#dc2626" stroke="#111" stroke-width="3"/><rect x="60" y="110" width="80" height="140" fill="#93c5fd" stroke="#111" stroke-width="3"/><circle cx="100" cy="150" r="16" fill="#fde047" stroke="#111" stroke-width="3"/><circle cx="100" cy="205" r="16" fill="#fde047" stroke="#111" stroke-width="3"/><polygon points="60,200 25,260 60,250" fill="#16a34a" stroke="#111" stroke-width="3"/><polygon points="140,200 175,260 140,250" fill="#16a34a" stroke="#111" stroke-width="3"/><text x="100" y="285" font-size="15" text-anchor="middle">Your rocket!</text></g></svg>