<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="Arial" font-weight="bold">
<rect width="100%" height="100%" fill="#fff"/>
<text x="260" y="28" font-size="20" text-anchor="middle">If you weigh 60 lb on Earth…</text>
<text x="90" y="77" font-size="18" text-anchor="end">Moon</text><rect x="100" y="55" width="32.0" height="32" fill="#94a3b8" rx="4"/><text x="140.0" y="77" font-size="18">≈ 10 lb</text><text x="90" y="127" font-size="18" text-anchor="end">Mars</text><rect x="100" y="105" width="73.60000000000001" height="32" fill="#f97316" rx="4"/><text x="181.60000000000002" y="127" font-size="18">≈ 23 lb</text><text x="90" y="177" font-size="18" text-anchor="end">Earth</text><rect x="100" y="155" width="192.0" height="32" fill="#2563eb" rx="4"/><text x="300.0" y="177" font-size="18">≈ 60 lb</text><text x="90" y="227" font-size="18" text-anchor="end">Jupiter</text><rect x="100" y="205" width="454.40000000000003" height="32" fill="#a16207" rx="4"/><text x="562.4000000000001" y="227" font-size="18">≈ 142 lb</text><text x="260" y="268" font-size="14" text-anchor="middle">Mass stays the same. Weight changes with gravity.</text></svg>